openapi: 3.0.3
info:
  title: Performance Snapshots API
  description: Endpoints for retrieving and refreshing monthly group performance snapshots
  version: 1.0.0

servers:
  - url: http://localhost:3001/api
    description: Local development

paths:
  /performance/snapshots/{year}/{month}:
    get:
      summary: Get monthly group performance snapshot
      description: |
        Returns the stored performance snapshot for the given year and month.
        If a snapshot exists on disk, it is returned immediately (cached).
        If the snapshot does not exist, the system attempts to fetch live data
        from the Tidig API and write a new snapshot. If the live API is
        unavailable, a 503 is returned with a descriptive error.
      operationId: getMonthlySnapshot
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2020
            example: 2026
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 3
        - name: refresh
          in: query
          required: false
          description: |
            When set to `true`, forces a re-fetch from the Tidig API even if
            a cached snapshot already exists. Falls back to cached data if API
            is unavailable.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Snapshot found or successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
              example:
                success: true
                data:
                  year: 2026
                  month: 3
                  totalBilledHours: 456
                  isPartial: false
                  snapshotCapturedAt: "2026-03-14T08:00:00.000Z"
                  consultantEntries:
                    - consultantId: "con-001"
                      consultantName: "Consultant A"
                      billedHours: 152
                      dataStatus: "complete"
                      capturedAt: "2026-03-14T08:00:00.000Z"
                    - consultantId: "con-002"
                      consultantName: "Consultant B"
                      billedHours: 168
                      dataStatus: "complete"
                      capturedAt: "2026-03-14T08:00:00.000Z"
                    - consultantId: "con-003"
                      consultantName: "Consultant C"
                      billedHours: 0
                      dataStatus: "missing"
                      capturedAt: "2026-03-14T08:00:00.000Z"
        "400":
          description: Invalid year or month parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "Invalid month: must be between 1 and 12"
        "422":
          description: Requested month is in the future
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "Cannot request snapshot for a future month"
        "503":
          description: No cached snapshot exists and live API is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "No snapshot available for this month and live data source is unavailable"

  /performance/snapshots:
    get:
      summary: List available snapshot months
      description: |
        Returns the list of months for which snapshots exist on disk.
        Used by the frontend to know which months have historical data available.
      operationId: listAvailableSnapshots
      responses:
        "200":
          description: List of available snapshot keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponse"
              example:
                success: true
                data:
                  available:
                    - "2026-03"
                    - "2026-02"
                    - "2026-01"

components:
  schemas:
    ConsultantMonthlyEntry:
      type: object
      required: [consultantId, consultantName, billedHours, dataStatus, capturedAt]
      properties:
        consultantId:
          type: string
          description: References User.id
        consultantName:
          type: string
          description: Denormalized display name
        billedHours:
          type: number
          minimum: 0
          description: Total billed hours for this consultant in the month
        dataStatus:
          type: string
          enum: [complete, partial, missing]
          description: Completeness of the data for this entry
        capturedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when this entry was last updated
        revenue:
          type: number
          description: Optional. Gross revenue in SEK. Not populated in v1.
        marginContribution:
          type: number
          description: Optional. Revenue minus direct costs in SEK. Not populated in v1.

    MonthlySnapshot:
      type: object
      required: [year, month, totalBilledHours, isPartial, snapshotCapturedAt, consultantEntries]
      properties:
        year:
          type: integer
          minimum: 2020
        month:
          type: integer
          minimum: 1
          maximum: 12
        totalBilledHours:
          type: number
          minimum: 0
        isPartial:
          type: boolean
          description: true if any consultant entry is partial or missing
        snapshotCapturedAt:
          type: string
          format: date-time
        consultantEntries:
          type: array
          items:
            $ref: "#/components/schemas/ConsultantMonthlyEntry"

    SnapshotResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/MonthlySnapshot"

    SnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [available]
          properties:
            available:
              type: array
              items:
                type: string
              description: List of YYYY-MM strings for which snapshots exist

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
